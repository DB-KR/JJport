<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JJPort - 개인 자산 관리 대시보드</title>
  
  <!-- CSS 스타일시트 연결 -->
  <link rel="stylesheet" href="style.css">
  
  <!-- 1. External Libraries (Chart.js & Supabase SDK) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="dashboard-container">
    
    <!-- 🟢 상단 헤더 영역 (타이틀 + 로그인/로그아웃 UI) -->
    <header class="dashboard-header" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #334155;">
      <h1 style="margin: 0; font-size: 1.5rem; color: #f8fafc;">💰 JJPort</h1>
      
      <!-- 로그인 / 사용자 정보 표시 영역 -->
      <div class="user-auth-area" style="display: flex; align-items: center; gap: 8px;">
        <span id="user-email" style="color: #94a3b8; font-size: 0.85rem; font-weight: 500;"></span>
        <input type="email" id="login-email" placeholder="이메일" style="padding: 6px 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; font-size: 0.85rem; width: 140px;">
        <input type="password" id="login-password" placeholder="비밀번호" style="padding: 6px 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; font-size: 0.85rem; width: 120px;">
        <button id="login-btn" style="padding: 6px 14px; background: #6366f1; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.2s; font-size: 0.85rem;">
          로그인
        </button>
        <button id="logout-btn" style="display: none; padding: 6px 14px; background: #475569; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.2s; font-size: 0.85rem;">
          로그아웃
        </button>
      </div>
    </header>

    <!-- 🟢 주요 자산 요약 카테고리 카드 영역 -->
    <section class="summary-cards" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px;">
      <div class="card">
        <h3>순자산 (Net Worth)</h3>
        <p id="net-worth" class="amount">₩0</p>
      </div>
      <div class="card">
        <h3>투자가치 (Invested)</h3>
        <p id="invested-value" class="amount">₩0</p>
      </div>
      <div class="card">
        <h3>현금성 자산</h3>
        <p id="cash-value" class="amount">₩0</p>
      </div>
    </section>

    <!-- 🟢 30대 자산 상위 % 백분율 게이지 바 -->
    <section class="rank-section" style="margin-top: 25px; background: #1e293b; padding: 20px; border-radius: 10px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="margin: 0;">30대 순자산 상위 백분위</h3>
        <span id="rank-percent" style="font-size: 1.4rem; font-weight: bold; color: #6366f1;">—</span>
      </div>
      <div class="meter-bg" style="width: 100%; height: 12px; background: #334155; border-radius: 6px; margin: 12px 0; overflow: hidden;">
        <div id="rank-bar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #6366f1, #10b981); transition: width 0.5s ease;"></div>
      </div>
      <p id="rank-caption" style="margin: 0; color: #94a3b8; font-size: 0.85rem;">로그인 후 자산을 추가하면 비교해 드려요</p>
    </section>

    <!-- 🟢 자산 추가 버튼 및 보유 자산 리스트 -->
    <section class="holdings-section" style="margin-top: 30px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h2>보유 자산 및 대출 내역</h2>
        <button id="open-tx-modal" style="padding: 8px 16px; background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">
          + 자산/대출 추가
        </button>
      </div>

      <div class="table-wrapper" style="overflow-x: auto;">
        <table style="width: 100%; border-collapse: collapse; text-align: left;">
          <thead>
            <tr style="border-bottom: 2px solid #334155; color: #94a3b8;">
              <th>자산/대출명</th>
              <th>분류</th>
              <th>수량 / 회차</th>
              <th>매수/원금</th>
              <th>현재가/잔액</th>
              <th>평가금액</th>
              <th>수익률 / 월상환</th>
              <th>관리</th>
            </tr>
          </thead>
          <tbody id="holdings-body">
            <!-- code.js를 통해 동적으로 자산 행이 들어옵니다 -->
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <!-- 🟢 자산/대출 추가 및 수정 모달 Dialog -->
  <dialog id="tx-modal" style="background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 12px; padding: 25px; width: 90%; max-width: 500px;">
    <form id="tx-form" method="dialog">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <span id="modal-eyebrow" style="color: #6366f1; font-size: 0.75rem; font-weight: bold; letter-spacing: 1px;">NEW RECORD</span>
          <h3 id="modal-title" style="margin: 4px 0 0 0;">자산 / 대출 기록하기</h3>
        </div>
        <button type="button" id="close-tx-modal" style="background: none; border: none; color: #94a3b8; font-size: 1.5rem; cursor: pointer;">&times;</button>
      </div>

      <input type="hidden" id="edit-tx-id" name="editId">

      <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 15px;">
        <label>
          날짜:
          <input type="date" id="tx-date" name="date" required style="width: 100%; padding: 8px; margin-top: 4px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 4px;">
        </label>

        <label>
          카테고리:
          <select id="tx-category" name="category" style="width: 100%; padding: 8px; margin-top: 4px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 4px;">
            <option value="국내주식">국내주식</option>
            <option value="해외주식">해외주식</option>
            <option value="ETF">ETF</option>
            <option value="부동산">부동산</option>
            <option value="채권">채권</option>
            <option value="가상자산">가상자산</option>
            <option value="현금">현금</option>
            <option value="대출">대출 (부채)</option>
          </select>
        </label>

        <label>
          자산/대출 이름:
          <input type="text" id="tx-name" name="name" placeholder="예: 삼성전자, 아파트 담보대출" required style="width: 100%; padding: 8px; margin-top: 4px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 4px;">
        </label>

        <label>
          통화:
          <select id="tx-currency" name="currency" style="width: 100%; padding: 8px; margin-top: 4px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 4px;">
            <option value="KRW">KRW (₩)</option>
            <option value="USD">USD ($)</option>
          </select>
        </label>

        <!-- 자산 전용 필드 -->
        <div class="asset-field" style="display: flex; flex-direction: column; gap: 12px;">
          <label id="type-label">
            매수/매도 구분:
            <select id="tx-type" name="type" style="width: 100%; padding: 8px; margin-top: 4px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 4px;">
              <option value="BUY">매수 (BUY)</option>
              <option value="SELL">매도 (SELL)</option>
            </select>
          </label>
          <label>
            수량:
            <input type="number" step="any" id="tx-qty" name="quantity" value="1" style="width: 100%; padding: 8px; margin-top: 4px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 4px;">
          </label>
          <label>
            매수가:
            <input type="number" step="any" id="tx-price" name="price" value="0" style="width: 100%; padding: 8px; margin-top: 4px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 4px;">
          </label>
          <label>
            현재가:
            <input type="number" step="any" id="tx-curr-price" name="currentPrice" value="0" style="width: 100%; padding: 8px; margin-top: 4px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 4px;">
          </label>
          <label>
            배당률 (%):
            <input type="number" step="any" id="tx-div-rate" name="dividendRate" value="0" style="width: 100%; padding: 8px; margin-top: 4px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 4px;">
          </label>
        </div>

        <!-- 대출 전용 필드 -->
        <div class="loan-field" style="display: none; flex-direction: column; gap: 12px;">
          <label>
            대출 원금:
            <input type="number" step="any" id="tx-loan-amount" name="loanAmount" value="0" style="width: 100%; padding: 8px; margin-top: 4px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 4px;">
          </label>
          <label>
            대출 금리 (%):
            <input type="number" step="any" id="tx-loan-rate" name="interestRate" value="0" style="width: 100%; padding: 8px; margin-top: 4px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 4px;">
          </label>
          <label>
            대출 기간 (개월):
            <input type="number" id="tx-loan-term" name="loanTermMonths" value="12" style="width: 100%; padding: 8px; margin-top: 4px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 4px;">
          </label>
        </div>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
        <button type="button" id="cancel-tx-modal" style="padding: 8px 16px; background: #475569; color: white; border: none; border-radius: 4px; cursor: pointer;">취소</button>
        <button type="submit" id="save-btn" style="padding: 8px 16px; background: #6366f1; color: white; border: none; border-radius: 4px; cursor: pointer;">기록 저장</button>
      </div>
    </form>
  </dialog>

  <!-- JS 로직 파일 연결 -->
  <script src="code.js"></script>
</body>
</html>
