name: Create 07:00 and 22:00 KST stock briefing

on:
  schedule:
    # 한국 시간 기준 오전 7시 (UTC 22:00)
    - cron: '0 22 * * *'
    # 한국 시간 기준 밤 10시 (UTC 13:00)
    - cron: '0 13 * * *'
  workflow_dispatch: # 수동 실행(Run workflow) 버튼 활성화

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate daily briefing via OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node -e '
          const fs = require("fs");
          const https = require("https");

          const RSS_URL = "https://news.google.com/rss/search?q=%EC%A3%BC%EC%8B%9C+%EC%A6%9D%EC%8B%9C+%EB%B0%98%EB%8F%84%EC%B2%B4&hl=ko&gl=KR&ceid=KR:ko";

          function fetchRSS(url) {
            return new Promise((resolve, reject) => {
              https.get(url, (res) => {
                let data = "";
                res.on("data", chunk => data += chunk);
                res.on("end", () => resolve(data));
              }).on("error", reject);
            });
          }

          async function run() {
            try {
              const xml = await fetchRSS(RSS_URL);
              const items = [];
              const matches = xml.matchAll(/<item>[\s\S]*?<title>(.*?)<\/title>[\s\S]*?<link>(.*?)<\/link>/g);
              for (const m of matches) {
                if (items.length >= 8) break;
                items.push({ title: m[1].replace(/<!\[CDATA\[(.*?)\]\]>/g, "$1"), url: m[2] });
              }

              const prompt = `다음 뉴스 목록에서 오늘 주식 시장에서 가장 중요한 뉴스 3개를 엄선하고 전체 시장 톤(positive/neutral/cautious)과 1줄 요약을 작성해줘.
              뉴스 목록: ${JSON.stringify(items)}
              
              응답은 반드시 아래 JSON 형식으로만 출력해:
              {
                "marketTone": "positive|neutral|cautious",
                "summary": "전체 시장 요약 한문장",
                "articles": [
                  { "title": "뉴스제목", "takeaway": "핵심 내용 1문장 요약", "source": "출처", "url": "링크" }
                ]
              }`;

              const req = https.request("https://api.openai.com/v1/chat/completions", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": `Bearer ${process.env.OPENAI_API_KEY}`
                }
              }, (res) => {
                let body = "";
                res.on("data", c => body += c);
                res.on("end", () => {
                  try {
                    const result = JSON.parse(body);
                    const content = JSON.parse(result.choices[0].message.content);
                    content.generatedAt = new Date().toISOString();
                    fs.writeFileSync("daily-briefing.json", JSON.stringify(content, null, 2));
                    console.log("Briefing generated successfully!");
                  } catch (e) {
                    console.error("Failed to parse response:", body);
                    process.exit(1);
                  }
                });
              });

              req.write(JSON.stringify({
                model: "gpt-4o-mini",
                messages: [{ role: "user", content: prompt }],
                response_format: { type: "json_object" }
              }));
              req.end();

            } catch (err) {
              console.error(err);
              process.exit(1);
            }
          }
          run();
          '

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
