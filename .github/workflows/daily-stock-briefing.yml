name: Create 07:00 and 22:00 KST stock briefing (RSS Direct)

on:
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Live News via RSS
        run: |
          node -e '
          const fs = require("fs");
          const https = require("https");

          const RSS_URL = "https://news.google.com/rss/search?q=%EC%A3%BC%EC%8B%9C+%EC%A6%9D%EC%8B%9C+%EB%B0%98%EB%8F%84%EC%B2%B4&hl=ko&gl=KR&ceid=KR:ko";

          function fetchRSS(url) {
            return new Promise((resolve, reject) => {
              https.get(url, (res) => {
                let data = "";
                res.on("data", chunk => data += chunk);
                res.on("end", () => resolve(data));
              }).on("error", reject);
            });
          }

          async function run() {
            try {
              const xml = await fetchRSS(RSS_URL);
              const articles = [];
              const matches = xml.matchAll(/<item>[\s\S]*?<title>(.*?)<\/title>[\s\S]*?<link>(.*?)<\/link>/g);
              for (const m of matches) {
                if (articles.length >= 5) break;
                let title = m[1].replace(/<!\[CDATA\[(.*?)\]\]>/g, "$1")
                               .replace(/&quot;/g, "\"")
                               .replace(/&amp;/g, "&");
                articles.push({
                  title: title,
                  takeaway: "최신 실시간 주식 관련 뉴스입니다.",
                  source: "Google News",
                  url: m[2]
                });
              }

              const briefingData = {
                generatedAt: new Date().toISOString(),
                marketTone: "neutral",
                summary: "실시간 RSS 뉴스 피드 수집 결과입니다.",
                articles: articles
              };

              fs.writeFileSync("daily-briefing.json", JSON.stringify(briefingData, null, 2));
            } catch (err) {
              console.error(err);
              process.exit(1);
            }
          }
          run();
          '

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
